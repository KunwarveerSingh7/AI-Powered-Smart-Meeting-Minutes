<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Meeting Minutes</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">

</head>
<body>

    <div class="login-page">

        <div class="login-card">

            <img
                src="/static/images/logo.png"
                alt="Smart Meeting Minutes logo"
                class="app-logo"
            >


            

            <h2>
                Welcome Back
            </h2>

            <p class="sub">
                Sign in to continue to your dashboard
            </p>

            <form id="loginForm">

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        required
                    >

                </div>

                <div
                    id="errorMessage"
                    class="error-message"
                >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Login
                </button>

            </form>

            <p class="login-note">
                Employees can log in using their company credentials.
                If you are having trouble logging in,
                please contact your system administrator.
            </p>

        </div>

    </div>

    <script src="/static/login.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
  
<head>
    <meta charset="UTF-8" />
   
    <title>Meeting Review</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Meeting Review</h1>

      <h2 id="meetingTitle"> Meeting</h2>

      <p id="meetingFile"></p>

      <hr>

      <h3> Extracted Meeting Notes</h3>

      <pre id="meetingText"> Loading Meeting...</pre>

      <hr>

<h3>AI Summary</h3>

<textarea
    id="aiSummary"
    rows="5"
    style="width: 100%;"
></textarea>

<br>

<button onclick="saveSummary()">
    Save Summary
</button>

<p id="summaryMessage"></p>

<hr>

<h3>Decisions</h3>

<div id="decisions">
    No decisions available.
</div>

<p id="decisionMessage"></p>

<hr>

<h3>AI Generated Tasks</h3>
<div id="tasks">
    No tasks available.
</div>

<br

<hr>

<button type="button" onclick="publishMeeting()">
    Publish Meeting
</button>

<p id="publishMessage"></p>



      <br>

      <button onclick="goBack()">Go Back</button>
    </div>

    <script src ="/static/meeting_review.js"></script>

    </body>

    </html>

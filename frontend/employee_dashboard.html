<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- the dashboard doesnt need to have the add meeting minutes option. that would be exclusive to the employee -->
    <title>Employee Dashboard</title>
</head>

    <body>

        <div class="dashboard">

            <h1> Employee Dashboard</h1>

            <p id="welcome_message">
                Welcome
            </p>

            <hr>
            <!-- the functionality is definitely basic as it needs the backend development -->
            <h2>My Tasks</h2>

<button type="button" id="refreshTasks">
    Refresh Tasks
</button>

<div id="taskList">
    Loading tasks...
</div>

<hr>

<h2>Meeting Information</h2>

<!-- Meeting Summary -->
<button type="button" id="showMeetingSummary">
    Meeting Summary
</button>

<div id="meetingSummaryBox" style="display: none;">
</div>

<br><br>


<!-- Meeting Decisions -->
<button type="button" id="showDecisions">
    Decisions
</button>

<div id="decisionsBox" style="display: none;">
</div>

<br><br>


<!-- Original extracted meeting notes -->
<button type="button" id="showMeetingNotes">
    Extracted Meeting Notes
</button>

<div id="meetingNotesBox" style="display: none;">
</div>


<hr>

<h2>Task History</h2>

<button type="button" id="showTaskHistory">
    Task History
</button>

<div id="taskHistoryList" style="display: none;">
</div>

            

            <br><br>

            <!-- the functionality is definitely basic as it needs the backend development -->
            <button onclick="logout()">
            Logout
        </button>

        </div>

        <script src="/static/employee_dashboard.js"></script>


    </body>
</html>
